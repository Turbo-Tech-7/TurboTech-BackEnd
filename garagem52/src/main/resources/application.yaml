spring:
  application:
    name: garagem52

  data:
    mongodb:
      uri: ${MONGO_URI}
      database: ${MONGO_DATABASE:garagem_52}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

api:
  token: ${API_TOKEN}

cors:
  allowed-origins: http://localhost:5173, http://localhost:3000

logging:
  level:
    org.springframework.web.servlet.handler.HandlerMappingIntrospector: ERROR
