spring:
  application:
    name: garagem52

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
    mongodb:
      uri: ${MONGO_URI}
      database: ${MONGO_DATABASE:garagem_52}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  mensageria:
    url: ${MENSAGERIA_URL:http://localhost:8081}
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:eventos.exchange}
    routing-key: ${RABBITMQ_ROUTING_KEY:eventos.routing-key}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

api:
  token: ${API_TOKEN}

cors:
  allowed-origins: http://localhost:5173, http://localhost:3000, http://32.196.17.132:5173/, http://52.5.248.227:5173/

logging:
  level:
    org.springframework.web.servlet.handler.HandlerMappingIntrospector: ERROR
